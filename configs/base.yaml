project:
  name: explainable-bert-kd-trec6
  artifact_root: artifacts

runtime:
  device: auto
  seed: 42
  deterministic: true
  resume: true
  smoke_test: false

data:
  dataset_name: lukasgarbas/trec
  dataset_revision: 4ae150f146d9c82be194a182e7f01c6b01c20d9d
  tokenizer_name: google-bert/bert-base-cased
  tokenizer_revision: cd5ef92a9fb2f889e972770a36d4ed042daf221e
  max_length: 512
  short_input_policy: filter
  validation_size: 0.1

model:
  pretrained_name: google-bert/bert-base-cased
  num_labels: 6

training:
  epochs: 3
  max_steps: null
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  inference_repeats: 20

distillation:
  temperature: 2.0
  task_loss_weight: 1.0
  kd_loss_weight: 1.0

xai:
  max_examples: 1
  ig_steps: 16

evaluation:
  classification_metrics:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
  attribution_metrics:
    - cosine_similarity
    - spearman_correlation
    - top_k_overlap
  latency_scope: classification_only
